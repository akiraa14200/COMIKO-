name: Build Comicko APK

on:
  workflow_dispatch:
  push:
    paths:
      - "COMIKO-source.zip"
      - ".github/workflows/build-comicko.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Comicko repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract the source archive already in this repository
        shell: bash
        run: |
          set -euo pipefail
          test -f COMIKO-source.zip
          mkdir -p source
          unzip -q COMIKO-source.zip -d source
          GRADLEW="$(find "$PWD/source" -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::COMIKO-source.zip does not contain a Gradle wrapper script."
            echo "Archive entries (first 80):"
            unzip -Z1 COMIKO-source.zip | head -80
            exit 1
          fi
          ROOT="$(dirname "$GRADLEW")"
          if [ ! -f "$ROOT/app/build.gradle.kts" ] && [ ! -f "$ROOT/app/build.gradle" ]; then
            echo "::error::Found gradlew but could not find app/build.gradle(.kts) beside it."
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found Android project: $ROOT"
          chmod +x "$GRADLEW"
          if [ ! -f "$ROOT/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Wrapper metadata missing; adding Gradle 9.3.1 configuration for this source archive."
            mkdir -p "$ROOT/gradle/wrapper"
            cat > "$ROOT/gradle/wrapper/gradle-wrapper.properties" <<'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS
          fi
          cd "$ROOT"
          git init -q
          git config user.name "Comicko Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Prepare source archive for Comicko build"

      - name: Apply Comicko app ID and display name
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          root = os.environ["PROJECT_ROOT"]
          gradle_files = [
              os.path.join(root, "app", "build.gradle.kts"),
              os.path.join(root, "app", "build.gradle"),
          ]
          found = False
          for path in gradle_files:
              if not os.path.isfile(path):
                  continue
              found = True
              data = open(path, encoding="utf-8").read()
              data = data.replace('applicationId = "eu.kanade.tachiyomi"', 'applicationId = "app.comicko"')
              data = data.replace('applicationId "eu.kanade.tachiyomi"', 'applicationId "app.comicko"')
              data = data.replace('applicationIdSuffix = ".debugYokai"', 'applicationIdSuffix = ""')
              data = data.replace('applicationIdSuffix = ".debug"', 'applicationIdSuffix = ""')
              open(path, "w", encoding="utf-8").write(data)
          if not found:
              raise SystemExit("Could not locate app Gradle file.")
          changed = 0
          for base, dirs, files in os.walk(root):
              dirs[:] = [d for d in dirs if d not in {".git", ".gradle", "build"}]
              for name in files:
                  if name != "strings.xml":
                      continue
                  path = os.path.join(base, name)
                  try:
                      data = open(path, encoding="utf-8").read()
                  except (OSError, UnicodeDecodeError):
                      continue
                  updated = re.sub(
                      r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                      r'\1Comicko\2',
                      data,
                      flags=re.DOTALL,
                  )
                  if updated != data:
                      open(path, "w", encoding="utf-8").write(updated)
                      changed += 1
          print(f"Applied Comicko branding; changed {changed} app-name resource files.")
          PY

      - name: Detect available Android debug variant and build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          ./gradlew --no-daemon :app:tasks --all > /tmp/comicko-gradle-tasks.txt
          echo "Available app assemble tasks:"
          grep -E '(^|:)assemble[^ ]*Debug([[:space:]]|$)' /tmp/comicko-gradle-tasks.txt || true
          if grep -Eq '^assembleDebug([[:space:]]|$)' /tmp/comicko-gradle-tasks.txt; then
            TASK=':app:assembleDebug'
          elif grep -Eq '^assembleStandardDebug([[:space:]]|$)' /tmp/comicko-gradle-tasks.txt; then
            TASK=':app:assembleStandardDebug'
          else
            TASK="$(grep -Eo '^assemble[A-Za-z0-9]*Debug([[:space:]]|$)' /tmp/comicko-gradle-tasks.txt | sed 's/[[:space:]]//g' | head -n 1)"
            if [ -z "$TASK" ]; then
              echo "::error::No Android debug assemble task was found in the app module."
              cat /tmp/comicko-gradle-tasks.txt
              exit 1
            fi
            TASK=":app:$TASK"
          fi
          echo "Building task: $TASK"
          ./gradlew --no-daemon "$TASK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: comicko-debug-apk
          path: source/**/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

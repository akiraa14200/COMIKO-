name: Build Comicko APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-comicko.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Comicko repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Get Yokai manga reader source
        run: |
          set -euo pipefail
          git clone --depth 0 https://github.com/null2264/yokai.git source/yokai
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/source/yokai" >> "$GITHUB_ENV"

      - name: Apply Comicko branding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          root = os.environ["PROJECT_ROOT"]
          gradle_file = os.path.join(root, "app", "build.gradle.kts")
          with open(gradle_file, encoding="utf-8") as f:
              data = f.read()
          data = data.replace('applicationId = "eu.kanade.tachiyomi"', 'applicationId = "app.comicko"')
          with open(gradle_file, "w", encoding="utf-8") as f:
              f.write(data)

          for base, dirs, files in os.walk(root):
              dirs[:] = [d for d in dirs if d not in {".git", ".gradle", "build"}]
              for name in files:
                  if name != "strings.xml":
                      continue
                  path = os.path.join(base, name)
                  try:
                      with open(path, encoding="utf-8") as f:
                          data = f.read()
                  except (OSError, UnicodeDecodeError):
                      continue
                  updated = re.sub(
                      r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                      r'\1Comicko\2',
                      data,
                      flags=re.DOTALL,
                  )
                  if updated != data:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(updated)
          print("Comicko application ID and app display names applied.")
          PY

      - name: Build universal debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleStandardDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: comicko-debug-apk
          path: source/yokai/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
